  .agb-tools .agb-dl{background:#1f9bd6}

  .agb-dlp{font-size:12.5px;color:#555;line-height:1.5;margin:0 0 16px}

  .agb-dlpanel button{flex:1;border:none;border-radius:9px;padding:11px;font-size:13px;font-weight:600;

  .agb-dlcopy{background:#2f8a3e;color:#fff}
  .agb-dlclose{background:#e6e8eb;color:#2b2b2b}
  .agb-dlpanel button:hover{filter:brightness(1.05)}
  @media print{ .agb-overlay{display:none !important} }
  .agb-tools .agb-state{font-size:11px;color:#666;min-height:14px;line-height:1.3}
  .agb-tools .agb-state.ok{color:#2f8a3e;font-weight:600}
  .agb-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10000;

  .agb-toast.show{opacity:1}
  @media print{ .agb-tools,.agb-toast{display:none !important} }

    if(n > 0){ el.textContent = 'Validé ' + n + '\u00d7 \u2014 annulations dispo'; el.className = 'agb-state ok'; }

  }

  // ============ CONVERSION EN TEXTE ÉDITABLE (type Word) ============
  // Chaque libellé SVG <text> devient un <div contenteditable> dans un <foreignObject>
  // -> le texte s'enroule dans le contour de la boîte et se réorganise à la suppression.
  function agbNum(el, a){ return parseFloat(el.getAttribute(a) || '0'); }

  function agbGroupTexts(svg){
    var texts = Array.prototype.slice.call(svg.querySelectorAll('text'));
    texts.forEach(function(t){
      t.__x = agbNum(t, 'x'); t.__y = agbNum(t, 'y');
      t.__fs = parseFloat(t.getAttribute('font-size') || '12');
      t.__fill = t.getAttribute('fill') || '#2b2b2b';
      t.__anchor = t.getAttribute('text-anchor') || 'start';
      t.__weight = t.getAttribute('font-weight') || '400';
      t.__style = t.getAttribute('font-style') || 'normal';
      t.__family = t.getAttribute('font-family') || 'Segoe UI, Arial, sans-serif';
      var dec = (t.getAttribute('text-decoration') || '') + ' ' + (t.getAttribute('style') || '');
      t.__struck = dec.indexOf('line-through') !== -1;
    });
    texts.sort(function(a, b){ if(Math.abs(a.__x - b.__x) > 4) return a.__x - b.__x; return a.__y - b.__y; });
    var labels = [], cur = null;
    texts.forEach(function(t){
      if(cur && Math.abs(t.__x - cur.x) <= 4 && (t.__y - cur.lastY) <= (t.__fs * 1.6)
         && t.__fill === cur.fill && Math.abs(t.__fs - cur.fs) < 1 && t.__struck === cur.struck){
        cur.items.push(t); cur.lastY = t.__y;
      } else {
        cur = { x: t.__x, y: t.__y, lastY: t.__y, fs: t.__fs, fill: t.__fill, anchor: t.__anchor,
                weight: t.__weight, style: t.__style, family: t.__family, struck: t.__struck, items: [t] };
        labels.push(cur);
      }
    });
    return labels;
  }

  function agbAnchorsOf(svg){
    var out = [];
    svg.querySelectorAll('rect').forEach(function(r){ if(agbNum(r, 'width') >= 90) out.push(r); });
    svg.querySelectorAll('polygon').forEach(function(p){ out.push(p); });
    svg.querySelectorAll('path').forEach(function(p){ if(!p.closest('defs')) out.push(p); });
    return out.map(function(a){ try{ return { el: a, b: a.getBBox() }; }catch(e){ return null; } }).filter(Boolean);
  }

  function agbEditableize(){
    document.querySelectorAll('svg.sheetsvg').forEach(function(svg){
      if(svg.getAttribute('data-editable') === '1') return;
      var anchors = agbAnchorsOf(svg);
      var labels = agbGroupTexts(svg);
      labels.forEach(function(lab){
        // union bbox des lignes
        var minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9, txt = [];
        lab.items.forEach(function(t){
          txt.push(t.textContent);
          try{ var b = t.getBBox();
            if(b.x < minx) minx = b.x; if(b.y < miny) miny = b.y;
            if(b.x + b.width > maxx) maxx = b.x + b.width; if(b.y + b.height > maxy) maxy = b.y + b.height;
          }catch(e){}
        });
        if(minx === 1e9){ minx = lab.x - 40; maxx = lab.x + 40; miny = lab.y - 8; maxy = lab.y + 8; }
        var cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;

        // boîte contenante « normale » (exclut la grande colonne responsable et les bandeaux)
        var box = null, area = 1e18;
        anchors.forEach(function(o){
          var b = o.b;
          if(b.height <= 140 && b.width <= 540 &&
             cx >= b.x - 1 && cx <= b.x + b.width + 1 && cy >= b.y - 1 && cy <= b.y + b.height + 1){
            var ar = b.width * b.height; if(ar < area){ area = ar; box = o; }
          }
        });

        var fx, fy, fw, fh, wrap;
        if(box){
          var b = box.b, tag = box.el.tagName.toLowerCase();
          if(tag === 'polygon'){ fw = b.width * 0.62; fx = b.x + (b.width - fw) / 2; fy = b.y + 2; fh = b.height - 4; }
          else { var padx = 5; fx = b.x + padx; fw = b.width - 2 * padx; fy = b.y + 1; fh = b.height - 2; }
          wrap = true;
        } else {
          var padx2 = 8; fx = minx - padx2; fw = (maxx - minx) + 2 * padx2; fy = miny - 2; fh = (maxy - miny) + 4;
          wrap = false;
        }
        if(fw < 8) fw = 8; if(fh < 8) fh = 8;

        var align = lab.anchor === 'middle' ? 'center' : (lab.anchor === 'end' ? 'right' : 'left');
        var content = txt.join(' ').replace(/\s+/g, ' ').trim();

        var fo = document.createElementNS(SVGNS, 'foreignObject');
        fo.setAttribute('x', fx); fo.setAttribute('y', fy);
        fo.setAttribute('width', fw); fo.setAttribute('height', fh);
        fo.setAttribute('class', 'agb-fo');
        var div = document.createElementNS(XHTML, 'div');
        div.setAttribute('class', 'agb-lbl');
        if(lab.struck) div.setAttribute('data-struck', '1');
        div.style.cssText =
          'width:100%;height:100%;box-sizing:border-box;display:flex;'
          + 'align-items:center;justify-content:' + (align === 'center' ? 'center' : (align === 'right' ? 'flex-end' : 'flex-start')) + ';'
          + 'text-align:' + align + ';line-height:1.15;overflow:visible;'
          + 'font-family:' + lab.family + ';font-size:' + lab.fs + 'px;color:' + lab.fill + ';'
          + 'font-weight:' + lab.weight + ';font-style:' + lab.style + ';'
          + (lab.struck ? 'text-decoration:line-through;' : '')
          + 'white-space:' + (wrap ? 'normal' : 'nowrap') + ';overflow-wrap:break-word;word-break:break-word;'
          + 'padding:0;margin:0;cursor:text;';
        div.textContent = content;
        fo.appendChild(div);

        var ref = lab.items[0];
        ref.parentNode.insertBefore(fo, ref);
        lab.items.forEach(function(t){ if(t.parentNode) t.parentNode.removeChild(t); });
      });
      svg.setAttribute('data-editable', '1');
    });
  }

  // ================= VALIDER (réutilisable) =================
  function agbValider(){
    agbHistory.push(document.body.innerHTML);
    // 1) barres indicatrices (rect 5 px)
    document.querySelectorAll('svg rect').forEach(function(r){ if(r.getAttribute('width') === '5') r.remove(); });
    // 2) responsables barrés (libellés convertis marqués data-struck)
    document.querySelectorAll('.agb-fo').forEach(function(fo){
      var d = fo.querySelector('.agb-lbl');
      if(d && d.getAttribute('data-struck') === '1') fo.remove();
    });
    // aussi d'éventuels <text> barrés restants
    document.querySelectorAll('svg text[text-decoration="line-through"]').forEach(function(t){ t.remove(); });
    // 3) retirer « (brouillon) »
    document.querySelectorAll('.agb-lbl').forEach(function(d){
      if(d.textContent.indexOf('brouillon') !== -1){ d.textContent = d.textContent.replace(/\s*\(brouillon\)/g, ''); }
    });
    // 4) bandeau
    var h1 = document.querySelector('.topbar h1');
    if(h1){ h1.textContent = h1.textContent.replace('(brouillon Rév. 4)', '(Rév. 4 \u2014 validée)'); }
    var p = document.querySelector('.topbar p');
    if(p){ p.textContent = 'Version validée. Marqueurs de suivi retirés. Imprimable (Ctrl+P \u2192 paysage).'; }
    // 5) légende + changements
    var lg = document.querySelector('.legend'); if(lg) lg.remove();
    var ch = document.querySelector('details.chg'); if(ch) ch.remove();

    if(agbMove) agbBuildBlocks();
    agbSetState();
    agbToast('Modifications validées (' + agbHistory.length + '\u00d7)');
  }
  function agbAnnuler(){
    if(agbHistory.length === 0){ agbToast('Rien à annuler'); return; }
    if(agbMove) agbToggleMove();
    document.body.innerHTML = agbHistory.pop();
    agbSetState();
    agbToast('Dernière validation annulée');
  }

  // ================= DÉPLACEMENT DES BLOCS =================
  function agbParseTranslate(el){
    var m = (el.getAttribute('transform') || '').match(/translate\(\s*(-?[\d.]+)[ ,]+(-?[\d.]+)\s*\)/);
    return m ? { x: parseFloat(m[1]), y: parseFloat(m[2]) } : { x: 0, y: 0 };
  }
  function agbApply(members, x, y){ for(var i=0;i<members.length;i++){ members[i].setAttribute('transform', 'translate(' + x + ',' + y + ')'); } }
  function agbCenter(el){
    var tag = el.tagName.toLowerCase();
    if(tag === 'text') return { x: agbNum(el,'x'), y: agbNum(el,'y') };
    if(tag === 'circle') return { x: agbNum(el,'cx'), y: agbNum(el,'cy') };
    if(tag === 'rect' || tag === 'foreignobject') return { x: agbNum(el,'x') + agbNum(el,'width')/2, y: agbNum(el,'y') + agbNum(el,'height')/2 };
    try{ var b = el.getBBox(); return { x: b.x + b.width/2, y: b.y + b.height/2 }; }catch(e){ return { x:-9999, y:-9999 }; }
  }
  // Détecte les étiquettes de branche OUI / NON (doivent rester indépendantes des carreaux)
  function agbIsBranchLabel(el){
    var s = '';
    if(el.tagName && el.tagName.toLowerCase() === 'foreignobject'){
      var d = el.querySelector('.agb-lbl');
      s = d ? d.textContent : el.textContent;
    } else {
      s = el.textContent || '';
    }
    s = s.replace(/\s+/g, ' ').trim().toUpperCase();
    return s === 'OUI' || s === 'NON';
  }
  function agbBuildBlocks(){
    agbBlocks = [];
    document.querySelectorAll('svg.sheetsvg').forEach(function(svg){
      var groups = agbAnchorsOf(svg).map(function(o){ return { b: o.b, members: [o.el] }; });
      var sats = [];
      var branchLabels = [];   // OUI / NON : ne suivent aucun carreau
      svg.querySelectorAll('foreignObject').forEach(function(f){ (agbIsBranchLabel(f) ? branchLabels : sats).push(f); });
      svg.querySelectorAll('circle').forEach(function(c){ sats.push(c); });
      svg.querySelectorAll('text').forEach(function(t){ (agbIsBranchLabel(t) ? branchLabels : sats).push(t); });
      svg.querySelectorAll('rect').forEach(function(r){ if(agbNum(r,'width') < 90) sats.push(r); });
      sats.forEach(function(s){
        var pt = agbCenter(s), best = null, bestA = Infinity;
        groups.forEach(function(g){
          var b = g.b;
          if(pt.x >= b.x-1 && pt.x <= b.x+b.width+1 && pt.y >= b.y-1 && pt.y <= b.y+b.height+1){
            var ar = b.width*b.height; if(ar < bestA){ bestA = ar; best = g; }
          }
        });
        if(best) best.members.push(s);
      });
      groups.forEach(function(g){ var t = agbParseTranslate(g.members[0]); agbBlocks.push({ members: g.members, tx: t.x, ty: t.y, svg: svg }); });
      // Chaque OUI / NON devient son propre bloc indépendant : il ne bouge plus avec les carreaux,
      // mais reste déplaçable séparément si on le saisit directement.
      branchLabels.forEach(function(lbl){
        var t = agbParseTranslate(lbl);
        agbBlocks.push({ members: [lbl], tx: t.x, ty: t.y, svg: svg });
      });
    });
  }
  function agbFindBlock(el){
    while(el && el.nodeType === 1){
      for(var i=0;i<agbBlocks.length;i++){ if(agbBlocks[i].members.indexOf(el) >= 0) return agbBlocks[i]; }
      el = el.parentNode;
    }
    return null;
  }
  function agbDown(e){
    if(!agbMove) return;
    var blk = agbFindBlock(e.target);
    if(!blk) return;
    e.preventDefault();
    var svg = blk.svg, inv = svg.getScreenCTM().inverse();
    function toUser(ev){ var p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(inv); }
    var s = toUser(e);
    agbDrag = { blk: blk, sx: s.x, sy: s.y, bx: blk.tx, by: blk.ty, toUser: toUser };
    window.addEventListener('pointermove', agbMoveEvt);
    window.addEventListener('pointerup', agbUp);
  }
  function agbMoveEvt(e){
    if(!agbDrag) return;
    var u = agbDrag.toUser(e);
    var nx = agbDrag.bx + (u.x - agbDrag.sx), ny = agbDrag.by + (u.y - agbDrag.sy);
    agbApply(agbDrag.blk.members, nx, ny); agbDrag.blk._nx = nx; agbDrag.blk._ny = ny;
  }
  function agbUp(){
    if(agbDrag){ agbDrag.blk.tx = agbDrag.blk._nx; agbDrag.blk.ty = agbDrag.blk._ny; }
    agbDrag = null;
    window.removeEventListener('pointermove', agbMoveEvt);
    window.removeEventListener('pointerup', agbUp);
  }
  function agbToggleMove(){
    agbMove = !agbMove;
    var btn = document.getElementById('agbMoveBtn');
    var svgs = document.querySelectorAll('svg.sheetsvg');
    if(agbMove){
      document.body.contentEditable = 'false';
      agbBuildBlocks();
      svgs.forEach(function(s){ s.classList.add('agb-movemode'); s.addEventListener('pointerdown', agbDown); });
      if(btn){ btn.textContent = '\u270b Déplacement : ON'; btn.classList.add('agb-on'); }
      agbToast('Glisse les blocs. (Les traits de liaison et les OUI/NON ne suivent pas.)');
    } else {
      document.body.contentEditable = 'true';
      svgs.forEach(function(s){ s.classList.remove('agb-movemode'); s.removeEventListener('pointerdown', agbDown); });
      if(btn){ btn.textContent = '\u270b Déplacer les blocs'; btn.classList.remove('agb-on'); }
      agbToast('Déplacement désactivé \u2014 édition de texte réactivée');
    }
  }

  // ================= TÉLÉCHARGEMENT =================
  function agbClosePanel(){
    document.querySelectorAll('.agb-overlay').forEach(function(e){ e.remove(); });
    if(agbLastUrl){ try{ URL.revokeObjectURL(agbLastUrl); }catch(e){} agbLastUrl = null; }
  }
  function agbCopyFallback(text, done){
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-2000px';
      document.documentElement.appendChild(ta); ta.focus(); ta.select();
      var okc = document.execCommand('copy'); ta.remove(); done && done(!!okc);
    }catch(e){ done && done(false); }
  }
  function agbCopy(text, btn){
    function done(s){ if(!btn) return; var o = btn.getAttribute('data-lbl'); btn.textContent = s ? '\u2713 Copié !' : '\u2717 Copie manuelle'; setTimeout(function(){ btn.textContent = o; }, 1800); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ agbCopyFallback(text, done); }); }
    else { agbCopyFallback(text, done); }
  }
  function agbTelecharger(){
    if(agbMove) agbToggleMove();
    var html;
    try{
      var clone = document.documentElement.cloneNode(true);
      clone.querySelectorAll('.agb-toast, .agb-overlay').forEach(function(e){ e.remove(); });
      clone.querySelectorAll('svg.sheetsvg').forEach(function(s){ s.classList.remove('agb-movemode'); });
      html = '<!DOCTYPE html>\n' + clone.outerHTML;
    }catch(err){ alert('Préparation du fichier impossible : ' + err.message); return; }

    var name = (agbHistory.length > 0) ? 'PR-COP_Rev4_validee.html' : 'PR-COP_Rev4_brouillon.html';
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    agbClosePanel();
    agbLastUrl = URL.createObjectURL(blob);

    try{
      var auto = document.createElement('a');
      auto.href = agbLastUrl; auto.download = name; auto.style.display = 'none';
      document.documentElement.appendChild(auto); auto.click();
      setTimeout(function(){ if(auto.parentNode) auto.parentNode.removeChild(auto); }, 200);
    }catch(e){}

    var ov = document.createElement('div'); ov.className = 'agb-overlay'; ov.setAttribute('contenteditable', 'false');
    var box = document.createElement('div'); box.className = 'agb-dlpanel';
    var h = document.createElement('div'); h.className = 'agb-dlh'; h.textContent = 'Enregistrer le HTML';
    var p = document.createElement('p'); p.className = 'agb-dlp';
    p.textContent = "Si l'enregistrement ne s'est pas lancé, clique le bouton bleu. Dans l'aperçu intégré à l'application, les téléchargements sont bloqués : utilise « Copier le HTML », colle dans le Bloc-notes et enregistre avec l'extension .html. Toutes tes retouches, suppressions et blocs déplacés sont inclus.";
    var link = document.createElement('a'); link.className = 'agb-dllink'; link.href = agbLastUrl; link.download = name; link.textContent = '\u2b07 Enregistrer ' + name;
    var row = document.createElement('div'); row.className = 'agb-dlrow';
    var copyBtn = document.createElement('button'); copyBtn.type = 'button'; copyBtn.className = 'agb-dlcopy'; copyBtn.textContent = '\u29c9 Copier le HTML'; copyBtn.setAttribute('data-lbl', '\u29c9 Copier le HTML');
    copyBtn.onclick = function(){ agbCopy(html, copyBtn); };
    var closeBtn = document.createElement('button'); closeBtn.type = 'button'; closeBtn.className = 'agb-dlclose'; closeBtn.textContent = 'Fermer'; closeBtn.onclick = agbClosePanel;
    row.appendChild(copyBtn); row.appendChild(closeBtn);
    box.appendChild(h); box.appendChild(p); box.appendChild(link); box.appendChild(row);
    ov.appendChild(box); ov.onclick = function(e){ if(e.target === ov) agbClosePanel(); };
    document.documentElement.appendChild(ov);
  }

  // ================= INIT =================
  try{ agbEditableize(); }catch(e){ /* si la conversion échoue, le document reste utilisable */ }
  agbSetState();
</script>

</body></html>
