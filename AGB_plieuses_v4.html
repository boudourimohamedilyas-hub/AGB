<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGB — Réaménagement des plieuses | v3</title>
<style>
  :root{
    --bg:#0a0d12; --line:#2a3a4e; --ink:#eef3fa; --muted:#8a9ab0;
    --blue:#4aa8ff; --alarm:#ff4d5e; --gain:#25d68e; --amber:#ffb020;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  #stage{position:fixed;inset:0} canvas{display:block}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(125% 95% at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.7) 100%)}
  #dim{position:fixed;inset:0;pointer-events:none;background:#05070c;opacity:0;transition:opacity .7s ease}
  #dim.on{opacity:.86}
  #flash{position:fixed;inset:0;pointer-events:none;background:#ff2d3f;opacity:0;mix-blend-mode:screen}

  #brand{position:fixed;top:18px;left:24px;pointer-events:none;display:flex;align-items:baseline;gap:10px;z-index:5;opacity:.75}
  #brand b{font-size:14px;letter-spacing:.24em;font-weight:800}
  #brand span{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  #statebadge{position:fixed;top:52px;left:24px;display:flex;align-items:center;gap:9px;padding:6px 12px 6px 10px;
    border:1px solid var(--line);background:rgba(8,12,19,.72);backdrop-filter:blur(6px);font-family:var(--mono);
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:0;transition:.45s ease;pointer-events:none;z-index:5}
  #statebadge.on{opacity:1}
  #statebadge i{width:7px;height:7px;background:var(--alarm);display:block;box-shadow:0 0 10px var(--alarm)}
  #statebadge.after i{background:var(--gain);box-shadow:0 0 10px var(--gain)} #statebadge.after{color:var(--gain)}

  #titlecard{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
    background:linear-gradient(180deg,rgba(10,13,18,.45),rgba(10,13,18,.88));pointer-events:none;opacity:0;transition:opacity .8s ease;z-index:6}
  #titlecard.on{opacity:1}
  #titlecard .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.42em;color:var(--blue);text-transform:uppercase;margin-bottom:20px}
  #titlecard h1{margin:0;font-size:clamp(32px,5.8vw,80px);line-height:.96;font-weight:850;letter-spacing:-.025em;text-align:center;text-transform:uppercase}
  #titlecard h1 em{font-style:normal;color:var(--blue)}
  #titlecard .rule{width:min(520px,70vw);height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:26px 0}
  #titlecard p{margin:0;font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;text-align:center}

  #caption{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);width:min(860px,84vw);
    text-align:center;opacity:0;transition:.5s ease;pointer-events:none;z-index:6}
  #caption.on{opacity:1;transform:translateX(-50%)}
  #caption h2{margin:0;font-size:clamp(19px,2.5vw,32px);font-weight:800;letter-spacing:-.015em;
    text-shadow:0 2px 30px rgba(0,0,0,.8)}
  #caption p{margin:9px 0 0;font-size:clamp(13px,1.35vw,16px);color:#c8d5e6;line-height:1.5;text-shadow:0 2px 20px rgba(0,0,0,.9)}

  #bignum{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
    pointer-events:none;opacity:0;transition:opacity .5s ease;z-index:7;text-align:center;padding:0 4vw}
  #bignum.on{opacity:1}
  #bignum .eyebrow{font-family:var(--mono);font-size:clamp(10px,1.05vw,12.5px);letter-spacing:.4em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
  #bignum .row{display:flex;align-items:baseline;gap:min(2.4vw,26px);line-height:.8}
  #bignum .n{font-family:var(--mono);font-weight:700;font-size:clamp(92px,21vw,320px);letter-spacing:-.05em;
    color:var(--alarm);text-shadow:0 0 90px rgba(255,77,94,.4)}
  #bignum .u{font-family:var(--mono);font-size:clamp(20px,3.6vw,56px);color:#f6a6ae}
  #bignum.g .n{color:var(--gain);text-shadow:0 0 90px rgba(37,214,142,.4)} #bignum.g .u{color:#9aeecb}
  #bignum .lab{margin-top:26px;font-size:clamp(16px,2vw,29px);font-weight:750;letter-spacing:-.01em}
  #bignum .sub{margin-top:12px;font-family:var(--mono);font-size:clamp(10.5px,1.2vw,14px);letter-spacing:.14em;color:#a9bbd2;text-transform:uppercase}
  #bignum .strip{display:flex;gap:min(4vw,52px);margin-top:38px;flex-wrap:wrap;justify-content:center}
  #bignum .strip div{font-family:var(--mono);font-size:clamp(9.5px,1vw,12px);letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
  #bignum .strip b{display:block;font-size:clamp(20px,2.5vw,34px);color:var(--ink);letter-spacing:-.02em;margin-top:7px}

  .lbl{position:fixed;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;z-index:4;
    opacity:0;transition:opacity .45s ease}
  .lbl.on{opacity:1}
  .lbl .box{border:1px solid rgba(120,150,185,.35);background:rgba(8,12,19,.78);backdrop-filter:blur(4px);padding:5px 9px;
    font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#cfdcec}
  .lbl.alarm .box{border-color:rgba(255,77,94,.5);color:#ffbcc3;background:rgba(30,8,12,.8)}
  .lbl.gain .box{border-color:rgba(37,214,142,.45);color:#a4f2ce;background:rgba(6,26,19,.8)}
  .lbl.blink .box{animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:.3}}

  #hud{position:fixed;left:24px;bottom:104px;border:1px solid var(--line);background:rgba(8,12,19,.8);
    backdrop-filter:blur(6px);padding:12px 16px;font-family:var(--mono);opacity:0;transition:.45s ease;pointer-events:none;z-index:5}
  #hud.on{opacity:1}
  #hud .k{font-size:9px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}
  #hud .v{font-size:28px;margin-top:4px;letter-spacing:-.02em;color:var(--alarm)}
  #hud.gain .v{color:var(--gain)}

  #bar{position:fixed;left:0;right:0;bottom:0;height:60px;display:flex;align-items:center;gap:10px;padding:0 18px;z-index:10;
    background:linear-gradient(180deg,rgba(10,13,18,0),rgba(10,13,18,.94) 45%);transition:opacity .5s ease}
  #bar.hide{opacity:0;pointer-events:none}
  .btn{border:1px solid var(--line);background:rgba(16,22,32,.8);color:var(--ink);cursor:pointer;font-family:var(--mono);
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:8px 12px;transition:.2s}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .btn.act{border-color:var(--blue);color:var(--blue)}
  #chapters{display:flex;gap:4px;flex:1;align-items:center}
  .chap{flex:1;height:22px;position:relative;cursor:pointer;background:none;border:0;padding:0}
  .chap .t{position:absolute;left:0;right:0;top:10px;height:2px;background:rgba(40,58,80,.9)}
  .chap .p{position:absolute;left:0;top:10px;height:2px;width:0;background:var(--blue)}
  .chap.done .p{width:100%}
  .chap .lab{position:absolute;left:0;top:-2px;font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:#55687f;
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .chap.cur .lab{color:var(--blue)}

  #params{position:fixed;right:18px;bottom:72px;width:296px;border:1px solid var(--line);background:rgba(8,12,19,.97);
    backdrop-filter:blur(10px);padding:16px;display:none;z-index:20}
  #params.on{display:block}
  #params h3{margin:0 0 4px;font-size:12.5px;letter-spacing:.05em}
  #params .hint{font-size:10.5px;color:var(--muted);margin:0 0 12px;line-height:1.45}
  #params label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:10px 0 4px}
  #params input{width:100%;background:#0c121b;border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:13px;padding:6px 8px}
  #params input:focus{outline:none;border-color:var(--blue)}
  #params .live{margin-top:12px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--gain);text-transform:uppercase}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="dim"></div><div id="flash"></div><div id="vignette"></div>

<div id="brand"><b>AGB</b><span>Étude d'implantation — pliage</span></div>
<div id="statebadge"><i></i><span id="statetxt">Implantation actuelle</span></div>

<div id="titlecard">
  <div class="eyebrow">Étude d'implantation · Département de pliage</div>
  <h1>Les plieuses<br>en <em>« L »</em></h1>
  <div class="rule"></div>
  <p id="titlesub">45 h perdues chaque mois</p>
</div>

<div id="caption"><h2 id="captitle"></h2><p id="captext"></p></div>

<div id="hud"><div class="k" id="hudk">Attente</div><div class="v" id="hudv">0,0 min</div></div>

<div id="bignum">
  <div class="eyebrow" id="bn-eye"></div>
  <div class="row"><span class="n" id="bn-n">0</span><span class="u" id="bn-u"></span></div>
  <div class="lab" id="bn-lab"></div><div class="sub" id="bn-sub"></div><div class="strip" id="bn-strip"></div>
</div>

<div id="params">
  <h3>Données de l'analyse</h3>
  <p class="hint">Les écrans se recalculent immédiatement, sans relancer le chapitre.</p>
  <label for="p1">Heures perdues par mois</label><input id="p1" type="number" step="1" value="45">
  <label for="p2">Jours ouvrables par mois</label><input id="p2" type="number" step="1" value="21">
  <label for="p3">Cycles de levage par jour</label><input id="p3" type="number" step="1" value="40">
  <label for="p4">Taux horaire chargé ($/h)</label><input id="p4" type="number" step="1" value="65">
  <label for="p5">Réduction visée (%)</label><input id="p5" type="number" step="5" value="80">
  <div class="live">↻ Mise à jour automatique</div>
</div>

<div id="bar">
  <button class="btn" id="play">Pause</button>
  <button class="btn" id="prev">◀</button>
  <button class="btn" id="next">▶</button>
  <button class="btn" id="spd">1×</button>
  <div id="chapters"></div>
  <button class="btn" id="cfg">Données</button>
  <button class="btn" id="fs">Plein écran</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==================================================================
   AGB — RÉAMÉNAGEMENT DES PLIEUSES · v3
   ================================================================== */
const CONFIG={heuresMois:45,joursMois:21,cyclesJour:40,taux:65,reduction:80};
const D={};
function derive(){
  D.hMois=CONFIG.heuresMois; D.hJour=D.hMois/CONFIG.joursMois;
  D.minCycle=(D.hJour*60)/CONFIG.cyclesJour; D.hAn=D.hMois*12;
  D.coutMois=D.hMois*CONFIG.taux; D.coutAn=D.hAn*CONFIG.taux;
  D.recupMois=D.hMois*CONFIG.reduction/100; D.recupAn=D.recupMois*12;
  D.gainAn=D.recupAn*CONFIG.taux; D.joursAn=D.recupAn/8;
}
derive();
const nf=n=>Math.round(n).toLocaleString('fr-CA');
const nf1=n=>n.toLocaleString('fr-CA',{minimumFractionDigits:1,maximumFractionDigits:1});

/* ------------------------- RENDU ------------------------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
document.getElementById('stage').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0d12);
scene.fog=new THREE.Fog(0x0a0d12,55,130);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,400);

/* --- textures procédurales --- */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function concreteTex(){
  const c=cv(512,512),x=c.getContext('2d');
  x.fillStyle='#4a4f57';x.fillRect(0,0,512,512);
  for(let i=0;i<26000;i++){const g=(Math.random()*46-23)|0;
    x.fillStyle='rgba('+(74+g)+','+(79+g)+','+(87+g)+',.6)';x.fillRect(Math.random()*512,Math.random()*512,2,2);}
  for(let i=0;i<26;i++){const r=30+Math.random()*110,px=Math.random()*512,py=Math.random()*512;
    const gr=x.createRadialGradient(px,py,0,px,py,r);
    gr.addColorStop(0,'rgba(35,38,44,.30)');gr.addColorStop(1,'rgba(35,38,44,0)');
    x.fillStyle=gr;x.beginPath();x.arc(px,py,r,0,7);x.fill();}
  x.strokeStyle='rgba(30,33,38,.35)';x.lineWidth=2;
  for(let i=0;i<6;i++){x.beginPath();x.moveTo(Math.random()*512,0);
    for(let y=0;y<512;y+=40)x.lineTo(Math.random()*512,y);x.stroke();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(14,10);
  t.encoding=THREE.sRGBEncoding;return t;
}
function corrugatedTex(){
  const c=cv(256,256),x=c.getContext('2d');
  x.fillStyle='#4d545e';x.fillRect(0,0,256,256);
  for(let i=0;i<256;i+=16){const g=x.createLinearGradient(i,0,i+16,0);
    g.addColorStop(0,'#3c424b');g.addColorStop(.5,'#5b636e');g.addColorStop(1,'#3c424b');
    x.fillStyle=g;x.fillRect(i,0,16,256);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(10,2);
  t.encoding=THREE.sRGBEncoding;return t;
}
function hatchTex(color){
  const c=cv(128,128),x=c.getContext('2d');
  x.clearRect(0,0,128,128); x.strokeStyle=color; x.lineWidth=13;
  for(let i=-128;i<256;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i+128,128);x.stroke();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}

/* --- lumières industrielles --- */
scene.add(new THREE.HemisphereLight(0xa8c6ee,0x14181f,.42));
const key=new THREE.DirectionalLight(0xfff2dd,1.15);
key.position.set(18,30,16);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-36,right:36,top:36,bottom:-36,near:1,far:96});
key.shadow.bias=-.0006; scene.add(key);
const fill=new THREE.DirectionalLight(0x5f92cc,.3);fill.position.set(-20,16,-12);scene.add(fill);

/* --- sol --- */
const floorMat=new THREE.MeshStandardMaterial({map:concreteTex(),roughness:.93,metalness:.03,color:0x8d939c});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,44),floorMat);
floor.rotation.x=-Math.PI/2;floor.position.set(-2,0,-2);floor.receiveShadow=true;scene.add(floor);

/* --- murs + charpente --- */
const wallMat=new THREE.MeshStandardMaterial({map:corrugatedTex(),roughness:.85,metalness:.25,color:0x757d88});
function wall(w,h,d,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallMat);
  m.position.set(x,y,z);m.receiveShadow=true;m.castShadow=true;scene.add(m);return m;}
wall(60,7,.5,-2,3.5,-19);    // mur nord
wall(.5,7,44,-30,3.5,-2);    // mur ouest (destination des racks)
wall(.5,7,44,26,3.5,-2);     // mur est
const trussMat=new THREE.MeshStandardMaterial({color:0x424954,roughness:.7,metalness:.5});
for(let z=-17;z<=17;z+=6){
  const b=new THREE.Mesh(new THREE.BoxGeometry(56,.5,.35),trussMat);b.position.set(-2,7.4,z);scene.add(b);
  for(let i=0;i<7;i++){const d=new THREE.Mesh(new THREE.BoxGeometry(.16,.16,4.6),trussMat);
    d.position.set(-2+(i-3)*8,7.1,z);d.rotation.x=.5;scene.add(d);}
  [-18,-6,6,18].forEach(x=>{
    const h=new THREE.Mesh(new THREE.BoxGeometry(2.2,.3,1.1),new THREE.MeshStandardMaterial({color:0xdfe6f0,emissive:0xfff0d8,emissiveIntensity:1.6}));
    h.position.set(x,7,z);scene.add(h);
    const pl=new THREE.PointLight(0xfff0d6,.30,26,2);pl.position.set(x,6.6,z);scene.add(pl);});
}

/* --- marquage au sol --- */
function paintZone(w,h,x,z,color,op){
  const t=hatchTex(color);t.repeat.set(w/2.2,h/2.2);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:op,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.position.set(x,.02,z);scene.add(m);
  const e=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:op*.25,depthWrite:false}));
  e.rotation.x=-Math.PI/2;e.position.set(x,.015,z);scene.add(e);
  const o={base:op,vis(b){m.visible=b;e.visible=b;},
    set(x2,z2){m.position.x=x2;m.position.z=z2;e.position.x=x2;e.position.z=z2;},
    op(v){m.material.opacity=v;e.material.opacity=v*.25;}};
  return o;
}
const depotA =paintZone(3.6,6.4,-23.6,-8,'#ffc23d',.5);
const depotB =paintZone(6.4,3.6,-13,-13.6,'#ffc23d',.5);
const depotB2=paintZone(3.6,6.4,-23.6,-1,'#ffc23d',.5); depotB2.vis(false);
const conflit=paintZone(9,8,-16,-11.5,'#ff3d4f',.55); conflit.vis(false);

/* --- plieuse réaliste --- */
function makePlieuse(){
  const g=new THREE.Group(),L=6.4,Dp=2.6,H=3.4;
  const body=new THREE.MeshStandardMaterial({color:0x2f3d4f,roughness:.55,metalness:.45});
  const steel=new THREE.MeshStandardMaterial({color:0xb9c2ce,roughness:.28,metalness:.9});
  const dark=new THREE.MeshStandardMaterial({color:0x1c242f,roughness:.7,metalness:.35});
  const add=(w,h,d,x,y,z,m)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||body);
    o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o);return o;};
  add(L,1.05,Dp,0,.52,0,dark);                       // bâti bas
  add(L,.12,Dp+.05,0,1.08,0,body);
  add(L,H*.72,.5,0,1.9,-Dp/2+.25);                    // dos
  [-1,1].forEach(s=>{ add(.75,H,Dp,s*(L/2-.38),H/2,0); // montants en C
    add(.8,.5,Dp+.1,s*(L/2-.38),H+.2,0,dark);});
  add(L-1.1,.85,.95,0,H-.75,-.1,body);                // tablier supérieur
  [-1,1].forEach(s=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,1.1,16),steel);
    c.position.set(s*1.6,H+.1,-.1);c.castShadow=true;g.add(c);});   // vérins
  add(L-1.9,.5,.14,0,H-1.36,-.1,steel);               // poinçon
  add(L-1.5,.35,.7,0,1.26,-.1,steel);                 // matrice / table
  add(L-1.8,.06,.5,0,1.45,-.55,dark);                 // butée arrière
  const pan=add(.6,1.25,.5,L/2+.1,1.55,.95,dark);     // pupitre
  const scr=add(.44,.34,.05,L/2+.1,1.98,1.21,new THREE.MeshStandardMaterial({color:0x1c4f7d,emissive:0x2f8fd6,emissiveIntensity:1.1}));
  add(1.4,.1,.5,0,.14,Dp/2+.35,dark);                 // pédale
  const bea=new THREE.Mesh(new THREE.SphereGeometry(.17,16,12),
    new THREE.MeshStandardMaterial({color:0xffb020,emissive:0xff8a00,emissiveIntensity:1.4}));
  bea.position.set(-L/2+.5,H+.55,0);g.add(bea);
  return g;
}
const POS={A:{p:new THREE.Vector3(-27.5,0,-8),r:Math.PI/2},
           Bav:{p:new THREE.Vector3(-13,0,-17.3),r:0},
           Bap:{p:new THREE.Vector3(-27.5,0,-1),r:Math.PI/2}};
const plieuseA=makePlieuse();plieuseA.position.copy(POS.A.p);scene.add(plieuseA);
const plieuseB=makePlieuse();plieuseB.position.copy(POS.Bav.p);plieuseB.rotation.y=POS.Bav.r;scene.add(plieuseB);

/* --- piles de tôle sur palettes --- */
function pile(n){
  const g=new THREE.Group();
  const pal=new THREE.Mesh(new THREE.BoxGeometry(2.9,.16,2),
    new THREE.MeshStandardMaterial({color:0x8a6b46,roughness:.95}));

  bar(W,.05,.05,0,H/2,-Dp);bar(W,.05,.05,0,-H/2,-Dp);

function forklift(col){
  const g=new THREE.Group();
  const paint=new THREE.MeshStandardMaterial({color:col,roughness:.45,metalness:.35});
  const dark=new THREE.MeshStandardMaterial({color:0x181d25,roughness:.8});
  const steel=new THREE.MeshStandardMaterial({color:0xa8b2c0,roughness:.3,metalness:.9});
  const add=(w,h,d,x,y,z,m)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||paint);
    o.position.set(x,y,z);o.castShadow=true;g.add(o);return o;};
  add(1.45,.85,2.4,0,.78,-.1);                    // châssis
  add(1.5,.7,.9,0,1.15,-1.25,dark);               // contrepoids
  add(1.1,.5,.85,0,1.5,-.55,dark);                // siège
  add(1.0,.12,.5,0,1.15,.55,dark);                // plancher
  for(let i=-1;i<=1;i+=2)for(let j=-1;j<=1;j+=2)
    add(.09,1.35,.09,i*.66,2.1,-.45+j*.62,dark);  // arceau
  add(1.5,.1,1.5,0,2.82,-.45,dark);
  for(let i=-1;i<=1;i+=2){
    add(.16,2.9,.16,i*.5,1.45,1.15,steel);        // mât
    add(.16,.1,1.35,i*.42,.24,1.95,steel);        // fourche
    add(.14,.5,.14,i*.42,.45,1.35,steel);}
  add(1.25,.1,.12,0,2.85,1.15,steel);
  const wm=new THREE.MeshStandardMaterial({color:0x14181f,roughness:.95});
  [[-.78,.9],[.78,.9],[-.62,-.95],[.62,-.95]].forEach(([x,z],i)=>{
    const w=new THREE.Mesh(new THREE.CylinderGeometry(i<2?.42:.34,i<2?.42:.34,.28,18),wm);
    w.rotation.z=Math.PI/2;w.position.set(x,i<2?.42:.34,z);w.castShadow=true;g.add(w);});
  const bea=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),
    new THREE.MeshStandardMaterial({color:0xffb020,emissive:0xff9000,emissiveIntensity:1.6}));
  bea.position.set(0,2.95,-.45);g.add(bea);
  const load=new THREE.Group();
  const lp=new THREE.Mesh(new THREE.BoxGeometry(2.5,.16,1.9),new THREE.MeshStandardMaterial({color:0x8a6b46,roughness:.95}));
  lp.position.y=.08;load.add(lp);
  for(let i=0;i<4;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(2.35,.13,1.75),
    new THREE.MeshStandardMaterial({color:0x9aa5b3,roughness:.35,metalness:.85}));
    p.position.y=.24+i*.145;p.castShadow=true;load.add(p);}
  load.position.set(0,.3,1.95);load.visible=false;g.add(load);
  g.userData.load=load;g.userData.beacon=bea;
  return g;
}

let cur=0,t0=performance.now(),playing=true,elapsed=0,speed=1;

  b.innerHTML='<span class="lab">'+s.id+'</span><span class="t"></span><span class="p"></span>';
  b.onclick=()=>goto(i);chapters.appendChild(b);});
const chapEls=[...chapters.children];
function enterScene(i){cur=i;elapsed=0;const s=SCENES[i];s.enter&&s.enter();s.refresh&&s.refresh();
  chapEls.forEach((c,k)=>{c.classList.toggle('cur',k===i);c.classList.toggle('done',k<i);});applyCam(0);}
function goto(i){enterScene((i+SCENES.length)%SCENES.length);}
function applyCam(p){const c=SCENES[cur].cam,e=ease(p);
  camera.position.set(lerp(c.from.p[0],c.to.p[0],e),lerp(c.from.p[1],c.to.p[1],e),lerp(c.from.p[2],c.to.p[2],e));
  camera.lookAt(lerp(c.from.t[0],c.to.t[0],e),lerp(c.from.t[1],c.to.t[1],e),lerp(c.from.t[2],c.to.t[2],e));}

function loop(now){
  requestAnimationFrame(loop);
  const raw=Math.min(.06,(now-t0)/1000);t0=now;
  const dt=raw*speed,s=SCENES[cur];
  if(playing){elapsed+=dt;if(elapsed>=s.dur)return goto(cur+1);}
  const p=Math.min(1,elapsed/s.dur);
  applyCam(p);s.update&&s.update(p);
  if(bigOn){bigVal+=(bigTarget-bigVal)*Math.min(1,raw*3.2);
    ui.bnN.textContent=nf(Math.abs(bigTarget-bigVal)<.8?bigTarget:bigVal);}
  [F1,F2].forEach(f=>{if(f.visible)f.userData.beacon.material.emissiveIntensity=1+Math.sin(now/120)*.9;});
  chapEls[cur].querySelector('.p').style.width=(p*100)+'%';
  updateLabels();renderer.render(scene,camera);
}

const playBtn=document.getElementById('play');
playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?'Pause':'Lecture';};
document.getElementById('prev').onclick=()=>goto(cur-1);
document.getElementById('next').onclick=()=>goto(cur+1);
const spdBtn=document.getElementById('spd');
spdBtn.onclick=()=>{si=(si+1)%SPEEDS.length;speed=SPEEDS[si];
  spdBtn.textContent=(speed+'').replace('.',',')+'×';spdBtn.classList.toggle('act',speed!==1);};
document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
const params=document.getElementById('params');
document.getElementById('cfg').onclick=()=>params.classList.toggle('on');
['p1','p2','p3','p4','p5'].forEach((id,k)=>{
  document.getElementById(id).addEventListener('input',e=>{
    const v=parseFloat(e.target.value)||0;
    if(k===0)CONFIG.heuresMois=v;if(k===1)CONFIG.joursMois=v||1;
    if(k===2)CONFIG.cyclesJour=v||1;if(k===3)CONFIG.taux=v;if(k===4)CONFIG.reduction=v;
    derive();SCENES.forEach(s=>s.refresh&&s===SCENES[cur]&&s.refresh());
    SCENES[0].refresh();});
});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();playBtn.click();}
  if(e.code==='ArrowRight')goto(cur+1);if(e.code==='ArrowLeft')goto(cur-1);
  if(e.key.toLowerCase()==='f')document.getElementById('fs').click();
  if(e.key.toLowerCase()==='r')goto(0);
  if(e.key.toLowerCase()==='s')spdBtn.click();
  if(e.key.toLowerCase()==='h')document.getElementById('bar').classList.toggle('hide');});
let idle;const bar=document.getElementById('bar');
addEventListener('mousemove',()=>{bar.classList.remove('hide');clearTimeout(idle);
  idle=setTimeout(()=>{if(!params.classList.contains('on'))bar.classList.add('hide');},2600);});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});
renderer.setSize(innerWidth,innerHeight);
SCENES[0].refresh();enterScene(0);requestAnimationFrame(loop);
</script>
</body>
</html>
