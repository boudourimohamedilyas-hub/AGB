<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tirage – Festival d'Automne Kedgwick · AGB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
:root{
  --bg:#2b1014; --bg2:#3d171c; --ink:#fbeedd; --muted:#d9b9a3;
  --maple:#b8323a; --pumpkin:#e07a2e; --gold:#e8b23c; --plum:#6e2a3a; --rust:#9c4a22;
  --line:rgba(251,238,221,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--bg:#2b1014}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;}
body{
  background:
    radial-gradient(1200px 700px at 50% -10%, #5a1e24 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 110%, #4a1a12 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow-x:hidden;
}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-family:"Caveat",cursive;font-size:clamp(40px,5vw,64px);font-weight:700;line-height:1;color:var(--gold)}
header p{margin:0;color:var(--muted);font-size:17px}

.stage{position:relative;display:flex;flex-direction:column;align-items:center}
.wheel-box{position:relative;width:min(100%,760px);aspect-ratio:1;margin-top:70px}
canvas#wheel{width:100%;height:100%;display:block;border-radius:50%;
  box-shadow:0 0 0 10px #1a0709, 0 0 0 14px var(--gold), 0 30px 80px rgba(0,0,0,.55)}
.logo-top{position:absolute;left:50%;top:-84px;transform:translateX(-50%);z-index:3;
  display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.logo-top img{width:78px;height:auto;display:block;border:3px solid var(--gold);border-radius:6px;background:#000}
.logo-top .pin{width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:38px solid var(--gold);margin-top:-2px}
.hub{position:absolute;left:50%;top:50%;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#3a1418,#14060a);border:5px solid var(--gold);
  display:grid;place-items:center;cursor:pointer;color:var(--ink);font:800 clamp(16px,2.4vw,26px)/1 "Bricolage Grotesque",sans-serif;
  letter-spacing:.02em;transition:transform .15s}
.hub:hover:not([disabled]){transform:translate(-50%,-50%) scale(1.05)}
.hub:focus-visible{outline:4px solid #fff;outline-offset:4px}
.hub[disabled]{cursor:default;opacity:.85}

.controls{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
button.big{font:800 22px/1 "Bricolage Grotesque",sans-serif;padding:18px 40px;border-radius:999px;border:0;cursor:pointer;
  background:var(--pumpkin);color:#2b1014;box-shadow:0 6px 0 #8d4313}
button.big:active{transform:translateY(4px);box-shadow:0 2px 0 #8d4313}
button.big[disabled]{opacity:.5;cursor:default}
label.opt{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:15px;cursor:pointer}
label.opt input{accent-color:var(--pumpkin);width:18px;height:18px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

aside{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:18px;padding:18px;position:sticky;top:16px}
aside h2{margin:0 0 4px;font-size:20px}
aside .count{color:var(--muted);font-size:14px;margin-bottom:12px}
aside input[type=search]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;font-size:15px}
ul.list{list-style:none;margin:10px 0 0;padding:0;max-height:46vh;overflow:auto;font-size:14px}
ul.list li{padding:6px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
ul.list li.out{opacity:.4;text-decoration:line-through}
.winners{margin-top:18px}
.winners h3{margin:0 0 6px;font-size:16px;color:var(--gold)}
.winners ol{margin:0;padding-left:22px;font-size:15px}
.winners li{padding:3px 0}
.small-btn{margin-top:10px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}

/* Winner overlay */
.overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:20px;
  background:radial-gradient(circle at 50% 45%, rgba(232,178,60,.35), rgba(20,5,8,.92) 60%)}
.overlay.show{display:grid}
.reveal{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:min(92vw,900px);text-align:center}
.reveal .hello{font-family:"Caveat",cursive;font-size:clamp(30px,4vw,48px);color:var(--gold);margin:0;opacity:0;animation:fadeUp .6s .2s forwards}
.reveal .name{margin:0;font-weight:800;font-size:clamp(36px,6.5vw,84px);line-height:1;color:#fff;
  text-shadow:0 4px 0 var(--maple),0 0 40px rgba(232,178,60,.7);opacity:0;animation:pop .7s .45s cubic-bezier(.2,1.6,.4,1) forwards}
.ticket{width:min(88vw,760px);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.9);
  opacity:0;transform:rotateY(90deg) scale(.6);animation:flip 1.1s .9s cubic-bezier(.2,1.2,.3,1) forwards}
.ticket-wrap{perspective:1200px;position:relative}
.ticket-wrap::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;
  animation:shine 2.4s 2.1s ease-in-out infinite;opacity:0}
.reveal .acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;animation:fadeUp .5s 2s forwards}
.reveal .acts button{font:700 17px/1 "Bricolage Grotesque",sans-serif;padding:14px 26px;border-radius:999px;border:0;cursor:pointer}
.reveal .acts .primary{background:var(--gold);color:#2b1014}
.reveal .acts .ghost{background:transparent;color:var(--ink);border:2px solid rgba(255,255,255,.4)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes flip{to{opacity:1;transform:rotateY(0) scale(1)}}
@keyframes shine{0%{opacity:1;background-position:150% 0}100%{opacity:1;background-position:-100% 0}}

canvas#leaves{position:fixed;inset:0;pointer-events:none;z-index:60}

@media (max-width:960px){.wrap{grid-template-columns:1fr}aside{position:static}}
@media (prefers-reduced-motion:reduce){.reveal *,.ticket{animation-duration:.01s!important;animation-delay:0s!important}.ticket-wrap::after{display:none}}
</style>
</head>

const COLORS = ["#b8323a","#e07a2e","#e8b23c","#6e2a3a","#9c4a22","#d4573b"];
const TEXT_ON = {"#e8b23c":"#2b1014","#e07a2e":"#2b1014"};

const cv = document.getElementById('wheel'), ctx = cv.getContext('2d');
const W = cv.width, R = W/2;
let rot = 0, spinning = false, removed = new Set(), winners = [];
let pool = [];

const fullName = p => (p.p + (p.n ? ' ' + p.n : '')).trim();
const key = p => fullName(p) + '|' + p.a;

function buildPool(){
  const incl = document.getElementById('inclInactive').checked;
  pool = PEOPLE.filter(p => (p.a || incl) && !removed.has(key(p)));
  draw(); renderList();
}

function draw(){
  ctx.clearRect(0,0,W,W);
  const n = pool.length;
  ctx.save(); ctx.translate(R,R); ctx.rotate(rot);
  if(n===0){
    ctx.fillStyle="#3d171c"; ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill(); ctx.restore(); return;
  }
  const seg = Math.PI*2/n;
  const fs = Math.max(9, Math.min(34, seg*R*0.78));
  for(let i=0;i<n;i++){
    const c = COLORS[i % COLORS.length === 0 && i===n-1 && n%COLORS.length===1 ? 1 : i % COLORS.length];
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R-2,i*seg,(i+1)*seg); ctx.closePath();
    ctx.fillStyle=c; ctx.fill();
    if(n<=240){ctx.strokeStyle="rgba(20,5,8,.35)"; ctx.lineWidth=1.2; ctx.stroke();}
    ctx.save(); ctx.rotate((i+.5)*seg);
    ctx.fillStyle = TEXT_ON[c] || "#fbeedd";
    ctx.font = `700 ${fs}px "Bricolage Grotesque", system-ui, sans-serif`;
    ctx.textAlign="right"; ctx.textBaseline="middle";
    let t = fullName(pool[i]); const maxW = R*0.74;
    while(ctx.measureText(t).width>maxW && t.length>3) t=t.slice(0,-2)+'…';
    ctx.fillText(t, R-22, 1);
    ctx.restore();
  }
  ctx.restore();
  // inner ring
  ctx.beginPath(); ctx.arc(R,R,R*0.12,0,Math.PI*2); ctx.fillStyle="#14060a"; ctx.fill();
}

function renderList(){
  const q = document.getElementById('q').value.trim().toUpperCase();
  const incl = document.getElementById('inclInactive').checked;
  const all = PEOPLE.filter(p=>p.a||incl).slice().sort((a,b)=>(a.n||a.p).localeCompare(b.n||b.p,'fr'));
  const ul = document.getElementById('list'); ul.innerHTML='';
  all.filter(p=>!q||fullName(p).includes(q)).forEach(p=>{
    const li=document.createElement('li'); li.textContent=(p.n?p.n+', ':'')+p.p;
    if(removed.has(key(p))) li.className='out';
    ul.appendChild(li);
  });
  document.getElementById('count').textContent = `${pool.length} noms dans la roue`;
  const ol=document.getElementById('winners'); ol.innerHTML='';
  winners.forEach(w=>{const li=document.createElement('li'); li.textContent=w; ol.appendChild(li);});
  const dis = spinning || pool.length===0;
  document.getElementById('spin').disabled = dis; document.getElementById('hub').disabled = dis;
}

// --- sound
let actx=null;
function tick(){
  if(!document.getElementById('sound').checked) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.value=1400+Math.random()*200;
    g.gain.setValueAtTime(.05,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.04);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.05);
  }catch(e){}
}
function fanfare(){
  if(!document.getElementById('sound').checked) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+i*.14;
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+(i===3?1.2:.3));
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+1.3);
    });
  }catch(e){}
}

function randInt(n){const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n;}

function spin(){
  if(spinning || pool.length===0) return;
  spinning=true; renderList();
  const n=pool.length, seg=Math.PI*2/n;
  const win = randInt(n);
  const jitter = (Math.random()*.7+.15);
  const target = (win+jitter)*seg;
  const TAU=Math.PI*2;
  let desired = (1.5*Math.PI - target) % TAU; if(desired<0) desired+=TAU;
  let cur = rot % TAU; if(cur<0) cur+=TAU;
  let delta = desired-cur; if(delta<0) delta+=TAU;
  const total = delta + TAU*(6+randInt(3));
  const start=rot, dur=7000+Math.random()*1500, t0=performance.now();
  let lastIdx=null;
  const ease=t=>1-Math.pow(1-t,4);
  function frame(now){
    const t=Math.min(1,(now-t0)/dur);
    rot = start + total*ease(t);
    draw();
    let th=(1.5*Math.PI-rot)%TAU; if(th<0) th+=TAU;
    const idx=Math.floor(th/seg);
    if(idx!==lastIdx){ if(lastIdx!==null) tick(); lastIdx=idx; }
    if(t<1) requestAnimationFrame(frame);
    else { spinning=false; celebrate(pool[win]); }
  }
  requestAnimationFrame(frame);
}

function celebrate(p){
  const name = fullName(p);
  winners.push(name);
  const ov=document.getElementById('overlay'), rv=document.getElementById('reveal');
  rv.innerHTML = `
    <p class="hello">Félicitations !</p>
    <h2 class="name" id="wName"></h2>
    <div class="ticket-wrap"><img class="ticket" src="${CARD}" alt="Laissez-passer Festival d'Automne Kedgwick 2026 – AGB"></div>
    <div class="acts"><button class="primary" id="again">Tirer un autre nom</button><button class="ghost" id="close">Fermer</button></div>`;
  rv.querySelector('#wName').textContent = name;
  ov.classList.add('show');
  fanfare(); party();
  rv.querySelector('#again').onclick=()=>{closeOverlay(); setTimeout(spin,350);};
  rv.querySelector('#close').onclick=closeOverlay;
  rv.querySelector('#close').focus();
  if(document.getElementById('removeWin').checked) removed.add(key(p));
  renderList();
}
function closeOverlay(){
  document.getElementById('overlay').classList.remove('show');
  leavesOn=false; buildPool();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && document.getElementById('overlay').classList.contains('show')) closeOverlay();
});

// --- confetti + leaves
function party(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(typeof confetti==='function' && !reduce){
    const colors=['#e8b23c','#e07a2e','#b8323a','#fbeedd','#ffffff'];
    const end=Date.now()+3500;
    confetti({particleCount:180,spread:100,startVelocity:55,origin:{y:.6},colors,zIndex:70});
    (function fr(){
      confetti({particleCount:6,angle:60,spread:60,origin:{x:0,y:.7},colors,zIndex:70});
      confetti({particleCount:6,angle:120,spread:60,origin:{x:1,y:.7},colors,zIndex:70});
      if(Date.now()<end) requestAnimationFrame(fr);
    })();
    setTimeout(()=>confetti({particleCount:120,spread:360,startVelocity:35,origin:{x:.5,y:.3},shapes:['star'],colors:['#e8b23c','#fff'],zIndex:70}),900);
  }
  if(!reduce) startLeaves();
}
const lc=document.getElementById('leaves'), lx=lc.getContext('2d');
let leaves=[], leavesOn=false;
function resizeL(){lc.width=innerWidth*devicePixelRatio; lc.height=innerHeight*devicePixelRatio;}
addEventListener('resize',resizeL); resizeL();
function leafPath(s){
  lx.beginPath(); lx.moveTo(0,-s);
  for(let k=0;k<5;k++){const a=-Math.PI/2+k*2*Math.PI/5; const b=a+Math.PI/5;
    lx.lineTo(Math.cos(a)*s,Math.sin(a)*s); lx.lineTo(Math.cos(b)*s*.45,Math.sin(b)*s*.45);}
  lx.closePath();
}
function startLeaves(){
  leavesOn=true; leaves=[];
  const d=devicePixelRatio;
  for(let i=0;i<45;i++) leaves.push({x:Math.random()*lc.width,y:-Math.random()*lc.height*.8,s:(10+Math.random()*16)*d,
    vy:(1.2+Math.random()*2)*d,vx:(Math.random()-.5)*1.5*d,r:Math.random()*6,vr:(Math.random()-.5)*.08,
    c:['#b8323a','#e07a2e','#e8b23c','#d4573b'][i%4],ph:Math.random()*6});
  requestAnimationFrame(stepLeaves);
}
function stepLeaves(){
  lx.clearRect(0,0,lc.width,lc.height);
  if(!leavesOn) return;
  let alive=0;
  leaves.forEach(l=>{
    l.ph+=.03; l.x+=l.vx+Math.sin(l.ph)*1.2; l.y+=l.vy; l.r+=l.vr;
    if(l.y<lc.height+40){alive++;
      lx.save(); lx.translate(l.x,l.y); lx.rotate(l.r); lx.fillStyle=l.c; lx.globalAlpha=.9; leafPath(l.s); lx.fill(); lx.restore();}
  });
  if(alive) requestAnimationFrame(stepLeaves); else lx.clearRect(0,0,lc.width,lc.height);
}

document.getElementById('spin').onclick=spin;
document.getElementById('hub').onclick=spin;
document.getElementById('q').oninput=renderList;
document.getElementById('inclInactive').onchange=buildPool;
document.getElementById('reset').onclick=()=>{ if(spinning) return; removed.clear(); buildPool(); };
document.addEventListener('keydown',e=>{ if(e.code==='Space' && document.activeElement.tagName!=='INPUT' && !document.getElementById('overlay').classList.contains('show')){e.preventDefault(); spin();} });

document.fonts && document.fonts.ready.then(draw);
buildPool();
</script>
